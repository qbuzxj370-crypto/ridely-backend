<div class="screen">
  <div id="rr-map" class="map-box"></div>

  <div class="card">
    <h3 id="rr-title" style="margin:0 0 8px"></h3>
    <p id="rr-comment" style="margin:0 0 8px"></p>
    <ul id="rr-highlights" style="margin:0; padding-left:18px"></ul>
  </div>

  <div class="card">
    <div>거리 <strong id="rr-distance"></strong> km · 예상 <strong id="rr-duration"></strong>분 · 누적고도 <strong id="rr-ascent"></strong>m</div>
    <div style="margin-top:6px"><span id="rr-intensity" class="badge"></span> <span id="rr-fallback-badge" class="badge" style="display:none">규칙 기반 코스</span></div>
  </div>

  <div class="card" id="rr-danger-card" style="display:none">
    <strong>⚠️ 사고다발지 안내</strong>
    <p id="rr-danger-alert" style="margin:6px 0 0"></p>
  </div>

  <div class="card">
    <strong>다음 코스 제안</strong>
    <p id="rr-next-step" style="margin:6px 0 0"></p>
  </div>

  <button class="btn btn-primary" id="rr-save">이 코스 저장하기</button>
</div>
