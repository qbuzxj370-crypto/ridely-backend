<div class="screen">
  <h2 id="auth-title">로그인</h2>
  <div id="auth-error"></div>
  <div class="field">
    <label>아이디</label>
    <input id="auth-loginId" type="text" autocomplete="username">
  </div>
  <div class="field">
    <label>비밀번호</label>
    <input id="auth-password" type="password" autocomplete="current-password">
  </div>
  <div class="field" id="auth-nickname-field" style="display:none">
    <label>닉네임</label>
    <input id="auth-nickname" type="text">
  </div>
  <div class="field" id="auth-location-consent-field" style="display:none">
    <label><input type="checkbox" id="auth-location-consent"> 라이딩 중 위치정보(GPS) 수집·이용에 동의합니다 — 이 정보는 서버로 전송되지 않고 기기에만 저장됩니다</label>
  </div>
  <button class="btn btn-primary" id="auth-submit">로그인</button>
  <button class="btn btn-outline" id="auth-toggle" style="margin-top:8px">계정이 없으신가요? 회원가입</button>
</div>
