<div class="screen">
  <div class="field">
    <input id="home-search-query" type="text" placeholder="장소 검색해서 지도 이동 (예: 여의도한강공원)">
    <button class="btn btn-secondary" id="home-search-btn" style="margin-top:6px">검색</button>
  </div>
  <div id="home-search-results"></div>

  <div id="home-map" class="map-box" style="height:280px"></div>

  <div class="card" id="home-tour-detail" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
      <strong>관광지 상세</strong>
      <button class="btn btn-secondary" id="home-tour-close" style="width:auto; padding:4px 10px; font-size:13px">닫기</button>
    </div>
    <div id="home-tour-body"></div>
  </div>

  <div class="card">
    <strong>주변 인프라 검색</strong>
    <div class="field" style="margin-top:8px">
      <label>반경 (m, 최대 5000)</label>
      <input id="home-radius" type="number" value="1000" min="100" max="5000" step="100">
    </div>
    <div id="home-type-checks" style="display:flex; flex-wrap:wrap; gap:10px; margin:8px 0; font-size:13px">
      <label><input type="checkbox" class="home-type" value="WATER" checked> 급수대</label>
      <label><input type="checkbox" class="home-type" value="TOILET" checked> 화장실</label>
      <label><input type="checkbox" class="home-type" value="CERT_CENTER" checked> 인증센터</label>
      <label><input type="checkbox" class="home-type" value="AIR_PUMP" checked> 공기주입기</label>
      <label><input type="checkbox" class="home-type" value="REPAIR_SHOP" checked> 수리소</label>
      <label><input type="checkbox" class="home-type" value="BIKE_STATION" checked> 따릉이</label>
      <label><input type="checkbox" class="home-type" value="ACCIDENT_ZONE" checked> 사고다발지</label>
      <label><input type="checkbox" id="home-tour" checked> 관광지</label>
    </div>
    <button class="btn btn-secondary" id="home-near-me">📍 내 주변 인프라 보기</button>
    <p style="margin:6px 0 10px; font-size:12px; color:var(--color-text-secondary)">내 위치는 서버로 보내지 않고 이 폰 안에서만 사용해요 (관광지는 아래 「이 위치 주변 검색」에서 볼 수 있어요)</p>
    <button class="btn btn-primary" id="home-infra-search">이 위치 주변 검색</button>
    <div id="infra-summary-body" class="empty-state" style="margin-top:8px">불러오는 중...</div>
  </div>

  <div class="card">
    <strong>Coach Ridely</strong>
    <p>오늘도 한강 라이딩 어때요? 목표 거리만 정하면 코스는 제가 짜드릴게요.</p>
  </div>
  <button class="btn btn-primary" onclick="location.hash='#/route-plan'">코스 추천 받기</button>
</div>
