<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- CSP — 실제로 쓰는 도메인만 허용한다 (2026-09-18 좁힘).
         script-src/style-src의 'unsafe-inline'은 각 화면 HTML의 onclick=""·style="" 인라인
         속성 때문에 필요하다 (예: index.html의 탭바 버튼). 'unsafe-eval'은 카카오맵 JS SDK가
         내부적으로 써서 뺄 수 없었다(제거 시 지도 로드 실패).
         connect-src의 http://localhost:8080·http://10.0.2.2:8080은 로컬 개발용 백엔드 주소다 —
         배포 시 실제 API 주소로 바꿔야 한다 (js/api.js의 API_BASE와 같이 바꿀 것).
         img-src의 tong.visitkorea.or.kr은 관광지 상세 카드의 사진(TourAPI) 도메인이다. 서버가
         원본 http 주소를 https로 바꿔 내려주므로(FRONTEND_GUIDE.md 5장 「관광지」) 이 도메인이
         빠지면 사진만 조용히 안 뜬다. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://dapi.kakao.com https://*.daumcdn.net https://*.kakaocdn.net;
        style-src 'self' 'unsafe-inline' https://*.daumcdn.net https://*.kakaocdn.net;
        img-src 'self' data: blob: https://tong.visitkorea.or.kr https://*.daumcdn.net https://*.kakaocdn.net https://*.kakao.com;
        connect-src 'self' https://d2ym1ymgumwyg8.cloudfront.net http://localhost:8080 http://10.0.2.2:8080 https://dapi.kakao.com https://*.daumcdn.net https://*.kakaocdn.net;
        font-src 'self' data:;
    ">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <!-- PWA — 스토어 등록 없이도 모바일 Chrome에서 "홈 화면에 추가"로 앱처럼 쓸 수 있게 한다
         (docs/shared/0918/MOBILE_WEB_FALLBACK_PLAN.md). Cordova 빌드에서는 그냥 무시되는
         메타데이터라 따로 분기할 필요 없다. -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E7B6C">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <title>Ridely</title>
</head>
<body>
    <div id="app-shell">
        <header id="app-header">
            <span class="app-brand">
                <img src="img/logo.png" class="app-logo" alt="" aria-hidden="true">
                <span class="app-title">Ridely</span>
            </span>
            <button id="header-back-btn" class="header-back-btn" style="display:none">&lt;</button>
        </header>
        <main id="app"><div id="tab-views"></div><div id="page-view" style="display:none"></div></main>
        <nav id="tabbar">
            <button class="tab-btn" data-route="home" onclick="location.hash='#/home'">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/>
                    <path d="M9 21v-7h6v7"/>
                </svg><span>홈</span>
            </button>
            <button class="tab-btn" data-route="saved-routes" onclick="location.hash='#/saved-routes'">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 3h12v18l-6-4-6 4V3Z"/>
                </svg><span>저장 경로</span>
            </button>
            <button class="tab-btn" data-route="riding" onclick="location.hash='#/riding'">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="5" cy="18" r="3"/>
                    <circle cx="19" cy="18" r="3"/>
                    <circle cx="15" cy="4" r="2"/>
                    <path d="m13 8-3 4 4 3 2-4 3 2M10 12l-5 6m9-3-2 3H5m11-7 3 7"/>
                </svg><span>라이딩</span>
            </button>
            <button class="tab-btn" data-route="mypage" onclick="location.hash='#/mypage'">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21a8 8 0 0 1 16 0"/>
                </svg><span>마이페이지</span>
            </button>
            <span id="tab-indicator" class="tab-indicator" aria-hidden="true"></span>
        </nav>
    </div>
    <script src="cordova.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
