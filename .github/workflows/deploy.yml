name: Deploy to EC2

# main 병합 시 자동 배포. 수동 실행(workflow_dispatch)도 열어둔다 —
# .env만 바꾸고 재배포하고 싶을 때 등, 코드 변경 없이도 트리거할 수 있게.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 연달아 push되면 먼저 것을 취소한다 — 두 배포가 겹쳐서
# systemd 재시작이 꼬이는 걸 막는다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # 테스트는 여기서 돌리지 않는다. PR CI(ci.yml)가 이미 같은 커밋을 검증했고,
      # main은 브랜치 보호 규칙에 따라 PR 병합으로만 갱신된다 - 직접 push가 막혀
      # 있어 검증되지 않은 커밋이 여기 올 수 없다.
      #
      # 배포마다 테스트 시간을 다시 쓰지 않으려는 것이다. 시연 직전 급한 수정에서
      # 그 차이가 크다. 브랜치 보호를 푼다면 이 결정도 함께 되돌려야 한다.
      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          JAR_FILE=$(ls target/*.jar | grep -v sources | head -1)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$JAR_FILE" ec2-user@"$EC2_HOST":/tmp/app.jar

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@"$EC2_HOST" '
            set -e

            # 돌고 있던 jar를 남겨 둔다. 첫 배포에는 되돌릴 대상이 없으므로
            # 실패를 무시한다 - set -e가 여기서 배포를 멈추면 안 된다.
            sudo cp /opt/ridely/app.jar /opt/ridely/app.jar.bak 2>/dev/null || true

            sudo mv /tmp/app.jar /opt/ridely/app.jar
            sudo chown ridely:ridely /opt/ridely/app.jar
            sudo systemctl restart ridely

            # 고정 대기 대신 재시도한다. Flyway가 새 마이그레이션을 적용하는
            # 배포는 기동이 길어지는데, 5초로 끊으면 정상 배포가 실패로 뜬다.
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
                echo "기동 확인 (${i}초)"
                exit 0
              fi
              sleep 1
            done

            # 여기까지 왔으면 새 jar로 뜨지 못했다.
            # 로그를 먼저 남긴다 - Actions 화면만 보고 원인을 알 수 있어야 한다.
            echo "기동 확인 실패: 30초 안에 health가 응답하지 않았다"
            sudo journalctl -u ridely -n 50 --no-pager || true

            # 깨진 버전을 운영에 두지 않는다. 직전 jar로 되돌린다.
            if [ -f /opt/ridely/app.jar.bak ]; then
              echo "직전 jar로 롤백한다"
              sudo mv /opt/ridely/app.jar.bak /opt/ridely/app.jar
              sudo systemctl restart ridely
            else
              echo "백업이 없어 롤백하지 못한다 (첫 배포)"
            fi

            exit 1
          '
