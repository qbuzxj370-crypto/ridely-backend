name: Deploy to EC2

# main 병합 시 자동 배포. 수동 실행(workflow_dispatch)도 열어둔다 —
# .env만 바꾸고 재배포하고 싶을 때 등, 코드 변경 없이도 트리거할 수 있게.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 연달아 push되면 먼저 것을 취소한다 — 두 배포가 겹쳐서
# systemd 재시작이 꼬이는 걸 막는다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          JAR_FILE=$(ls target/*.jar | grep -v sources | head -1)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$JAR_FILE" ec2-user@"$EC2_HOST":/tmp/app.jar

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@"$EC2_HOST" '
            set -e
            sudo mv /tmp/app.jar /opt/ridely/app.jar
            sudo chown ridely:ridely /opt/ridely/app.jar
            sudo systemctl restart ridely

            # 고정 sleep 대신 최대 60초 폴링한다. 실측 기동 시간이 13~14초라
            # 고정 sleep 5초로는 배포가 성공해도 헬스체크만 너무 일찍 실패할 수 있다.
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/api/v1/health; then
                exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패 - journalctl -u ridely 로 확인 필요"
            exit 1
          '
