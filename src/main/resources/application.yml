# ============================================================
# Ridely 공통 설정 (application.yml)
# ============================================================
# 프로파일별 오버라이드: application-{local|dev|prod}.yml
# ============================================================

spring:
  application:
    name: ridely

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ===== Web =====
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ===== Jackson =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ===== DB 마이그레이션 (Flyway) =====
  # 앱 기동 시 src/main/resources/db/migration 의 V*.sql 을 순서대로 적용한다.
  # 이미 적용된 것은 flyway_schema_history 로 판별해 건너뛴다.
  # 적용된 마이그레이션 파일은 수정 금지 — 체크섬이 달라지면 기동이 실패한다(의도된 동작).
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 실패 시 조용히 넘어가지 않고 기동을 멈춘다
    validate-on-migrate: true

    # PostGIS 이미지는 컨테이너 최초 기동 시 확장을 설치하면서 public 스키마에
    # spatial_ref_sys 테이블과 geometry_columns·geography_columns 뷰를 만든다.
    # 그래서 볼륨을 지운 새 DB도 Flyway 눈에는 "비어있지 않은 스키마"이고,
    # 이 옵션이 없으면 "Found non-empty schema but no schema history table" 로 기동이 막힌다.
    baseline-on-migrate: true

    # ⚠️ 0이어야 한다. 기본값은 1이고, 1로 두면 V1이 "이미 적용됨"으로 표시되어
    #    건너뛴다 — 테이블이 하나도 생기지 않은 채 기동만 성공한다.
    #    0으로 두면 baseline(0) 이후인 V1부터 정상 적용된다.
    baseline-version: 0
    baseline-description: "postgis bootstrap (spatial_ref_sys)"

  # ===== DataSource (PostgreSQL) =====
  # 프로파일별 오버라이드: application-{local|dev|prod}.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridely}
    username: ${DB_USER:ridely}
    # 비밀번호도 기본값을 두지 않는다 (위 JWT_SECRET과 같은 이유)
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== Spring AI 1.1.6 - Google Gen AI =====
  # spring-ai-starter-model-google-genai 기반 (Spring AI 1.x에 정상 존재)
  #
  # 환경별 전환 전략:
  #   개발: Gemini Developer API (api-key 방식, 카드 불필요)
  #   운영: Vertex AI (project-id 방식, GCP 인증)
  # → application-local.yml 에서 api-key 설정
  # → application-prod.yml  에서 vertex 설정
  #
  # ADR-003 참조
  ai:
    # 채팅 모델 공급자를 명시한다.
    #
    # ⚠️ 이 줄이 없으면 기동이 실패한다. bedrock-converse 스타터가 들어오면서
    #    ChatModel 후보가 둘이 됐고, 선택자가 없으면 두 오토컨피그가 모두 켜진다.
    #      No qualifying bean of type ChatModel: expected single matching bean but found 2:
    #        bedrockProxyChatModel, googleGenAiChatModel
    #
    #    prod는 application-prod.yml이 bedrock-converse로 덮는다.
    #    여기 기본값이 없으면 prod만 뜨고 로컬·테스트는 전부 죽는다.
    #
    #    LLM_PROVIDER 환경변수로 공급자를 바꿀 수 있다: google-genai | bedrock-converse | openai.
    #    openai는 계정 관리자가 발급한 LiteLLM 게이트웨이(OpenAI 호환) 경로다. 2026-09-29에
    #    Bedrock 직접 권한이 회수되므로 그 뒤 운영은 이 값이 openai여야 한다.
    model:
      chat: ${LLM_PROVIDER:google-genai}
      # ⚠️ openai 스타터는 채팅 말고도 임베딩·이미지·음성·모더레이션 자동설정이 딸려 오고, 전부
      #    matchIfMissing=true라 선택자가 없으면 켜진다. 켜지면 API 키를 요구해서 키 없는
      #    로컬·테스트 기동이 깨진다. 우리는 채팅만 쓰므로 나머지는 끈다.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # OpenAI 호환 게이트웨이. 값은 전부 환경변수로만 준다 — 저장소가 공개라 주소·키를 적지 않는다.
    # base-url에는 /v1을 붙이지 않는다(Spring AI가 /v1/chat/completions를 덧붙인다).
    # 모델 별칭은 게이트웨이가 정한다: bedrock-haiku | bedrock-sonnet | bedrock-gpt-5.6-luna.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:bedrock-sonnet}
    google:
      genai:
        chat:
          options:
            # ⚠️ 2026-08-14: gemini-2.5-flash가 신규 사용자에게 닫혀 전환했다.
            #    "This model models/gemini-2.5-flash is no longer available to new users" 404.
            #    예고 은퇴일(10-16)보다 먼저 차단이 걸렸다.
            #
            #    모델 선택 기준은 성능이 아니라 무료 한도다. AI Studio 콘솔 실측:
            #      3.7 Flash        RPM 5  / RPD 20
            #      3.6 Flash        RPM 5  / RPD 20
            #      3.5 Flash Lite   RPM 20 / RPD 500   ← 채택
            #
            #    우리 파이프라인은 추천 1회에 LLM을 2번 부른다. RPD 20이면 하루 10회가 상한이라
            #    개발 중 테스트만으로 오전에 소진된다. Lite는 thinking도 기본 minimal이라 응답이 빠르다.
            #    작업 자체가 "목록에서 3곳 고르기 + 두 문장 쓰기"라 상위 모델의 추론력이 필요 없다.
            #
            #    품질이 부족하면 설계만 Lite로 두고 코멘트를 상위 모델로 올린다. 다만 그러면
            #    코멘트가 RPD 20에 묶인다. 유료 티어 전환이 근본 해결책이다 — DATA_SOURCES 4장.
            model: gemini-3.5-flash-lite
            temperature: 0.7
    # Spring AI 자체 재시도를 끈다.
    #
    # 기본값(SpringAiRetryProperties)이 대화형 요청에 맞지 않는다. maxAttempts 10,
    # 백오프 2초에서 시작해 5배씩 늘고 상한이 180초다. 배치용 설정이다.
    # 우리 목표 p50은 10초이고, 전송 실패는 기다리는 대신 fallback으로 간다.
    #
    # ⚠️ 지금 이 값은 실제로는 아무것도 바꾸지 않는다. 2026-09-13 관측에서
    # 재시도가 애초에 일어나지 않았다 - GoogleGenAiChatModel이 전송 실패를
    # RuntimeException(Failed to generate content)으로 싸서 올리는데, Spring AI의
    # 재시도 정책은 TransientAiException만 대상으로 삼기 때문이다.
    # 로그에 Retry count가 호출당 한 줄씩만 찍힌 것이 근거다.
    #
    # 그래도 남겨 둔다. 예외 분류가 바뀌거나 다른 모델로 옮기면 기본값 10이
    # 그대로 살아나고, 그때는 한 요청이 수 분을 돈다.
    #
    # 우리 재시도(ridely.ai.llm.max-retry)와 층이 다르다. 저쪽은 HTTP 전송 실패고
    # 이쪽은 구조화 출력 JSON이 깨졌을 때이며 즉시 한 번만 다시 부른다.
    #
    # maxAttempts는 첫 호출을 포함한 총 횟수다. 1이면 재시도 없음이다.
    # onClientErrors 기본값이 false라 4xx는 원래 재시도하지 않는다 - 429가 여기 든다.
    retry:
      max-attempts: 1
    # pgvector Vector Store — RAG 착수 시 재활성 (pom의 pgvector starter 주석과 세트)
    # vectorstore:
    #   pgvector:
    #     index-type: HNSW
    #     distance-type: COSINE_DISTANCE
    #     dimensions: 768
    #     table-name: riding_history_embedding
    # 임베딩 — RAG 착수 시 재활성 (pom의 vertex embedding starter 주석과 세트)
    # 재활성 전 결정: gemini-embedding-001 호출 경로 (google-genai embedding vs vertex embedding) — ADR-005
    # vertex:
    #   ai:
    #     embedding:
    #       text:
    #         options:
    #           # text-embedding-004는 2026-01-14 은퇴 → gemini-embedding-001 (3072차원 기본, MRL로 768 축소 지정 필수)
    #           model: gemini-embedding-001
    #           dimensions: 768

# ===== MyBatis (ADR-002 옵션 Y: 단순 CRUD 도메인) =====
# 사용 규칙:
#   - 단순 CRUD: MyBatis Mapper XML
#   - PostGIS·pgvector 연산자: JdbcClient + Raw SQL (별도)
#   - 벡터 검색: Spring AI VectorStore (위 spring.ai.vectorstore 참조)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: kr.ridely
  configuration:
    map-underscore-to-camel-case: true    # user_id → userId 자동 매핑
    default-statement-timeout: 30
    jdbc-type-for-null: NULL
    cache-enabled: false                  # 2차 캐시 미사용 (명시적)
    # 1차(로컬) 캐시를 문장 단위로 제한한다. cache-enabled는 2차 캐시만 끄고,
    # 1차 캐시는 이 값으로만 제어되며 기본값이 SESSION이다.
    #
    # SESSION이면 한 트랜잭션 안에서 같은 조회를 두 번 할 때 두 번째가 캐시에서 나온다.
    # MyBatis로 쓴 경우엔 UPDATE가 캐시를 비워 문제가 없지만, JdbcClient로 쓴 변경은
    # MyBatis가 알지 못해 갱신 전 객체가 그대로 돌아온다.
    # 실제로 라이딩 종료(JdbcClient UPDATE) 응답이 종료 전 값으로 나갔다.
    #
    # ADR-002가 PostGIS 구간을 JdbcClient로 쓰라고 해서 이 조합은 앞으로도 계속 생긴다.
    # 조회마다 캐시를 비우는 비용보다 낡은 값을 응답하는 쪽이 훨씬 비싸다.
    local-cache-scope: STATEMENT

# ===== Server =====
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always
    include-binding-errors: always

# ===== Actuator (헬스체크) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# ===== Ridely 애플리케이션 설정 =====
ridely:
  # JWT
  jwt:
    # 기본값을 두지 않는다. 저장소가 공개돼 있어 기본값을 적어 두면 그 값이 그대로 노출되고,
    # 환경변수 설정을 깜빡한 채 배포하면 누구나 같은 키로 토큰을 위조할 수 있다.
    # 값이 없으면 기동 시점에 실패하는 편이 안전하다.
    secret: ${JWT_SECRET}
    # 액세스 토큰은 발급 뒤 무효화할 방법이 없다. 서명만 맞으면 통과하도록 설계된 것이고
    # 서버에 기록이 없어 지울 대상 자체가 없다. 그래서 수명을 줄이는 것 말고는
    # 손쓸 수단이 없다.
    #
    # 탈퇴하거나 정지된 계정의 토큰도 이 시간 동안은 살아 있다. 소비자 앱이 흔히 쓰는
    # 범위가 5~15분이라 상한을 택했다. 1시간이던 것을 줄였고, 줄인 만큼 재발급이 잦아진다.
    #
    # 토큰 단위로 즉시 폐기하려면 폐기 목록(Redis 등)이 필요한데 그만한 정밀도가
    # 아직 필요하지 않다. 민감한 작업(탈퇴·비밀번호 변경)은 비밀번호를 다시 받아 막는다.
    access-token-validity-seconds: 900        # 15분
    # 리프레시는 DB에 행이 있어 폐기할 수 있다. 회전형이라 한 번 쓰면 무효가 된다.
    refresh-token-validity-seconds: 1209600   # 14일
    issuer: ridely

  # 공공데이터 원본 파일 경로.
  # 이 파일들은 저장소에 커밋하지 않는다(db/seed/는 .gitignore 대상).
  # 각자 공공데이터포털에서 내려받아 배치한다 — docs/shared/DATA_SOURCES.md 3장 참조.
  #
  # 파일명에 한글이 들어가는데 자바는 파일명 인코딩에 sun.jnu.encoding(OS 로케일)을 쓴다.
  # 환경에 따라 이름을 조정해야 할 수 있어 코드가 아닌 설정으로 뺐다.
  seed:
    bike-route-coords: db/seed/국토종주_자전거길_노선좌표.csv
    bike-route-facilities: db/seed/국토종주자전거길_주변시설_좌표정보.csv

  # 외부 API
  external:
    # 한국관광공사 TourAPI ★ 관광데이터 공모전 핵심
    tourapi:
      # 활용매뉴얼 v4.4(2026-02) 기준 현행 서비스는 KorService2.
      # 오퍼레이션명도 모두 2로 끝난다 (locationBasedList2, detailCommon2 등).
      base-url: https://apis.data.go.kr/B551011/KorService2
      service-key: ${TOUR_API_KEY:}
      timeout-seconds: 10
      # MVP 적재 대상 콘텐츠 타입 (12=관광지, 14=문화시설, 39=음식점)
      content-type-ids: 12,14,39
      # 관광 콘텐츠 수집 범위.
      # 지역 확장 시 코드 수정 없이 지점만 추가하면 된다.
      # 반경 20km 한 번으로 덮으면 한강과 무관한 서울 전역이 딸려오므로
      # 한강 축을 따라 중심점을 두고 인접 지점과 겹치도록 배치한다.
      ingest:
        radius-m: 3000
        points:
          - { name: "아라한강갑문",   lng: 126.7965, lat: 37.5836 }
          - { name: "행주대교",       lng: 126.8330, lat: 37.5900 }
          - { name: "난지한강공원",   lng: 126.8783, lat: 37.5665 }
          - { name: "선유도공원",     lng: 126.8997, lat: 37.5434 }
          - { name: "여의도한강공원", lng: 126.9339, lat: 37.5265 }
          - { name: "노들섬",         lng: 126.9720, lat: 37.5170 }
          - { name: "반포한강공원",   lng: 126.9954, lat: 37.5100 }
          - { name: "잠원한강공원",   lng: 127.0300, lat: 37.5170 }
          - { name: "뚝섬한강공원",   lng: 127.0700, lat: 37.5290 }
          - { name: "잠실한강공원",   lng: 127.0820, lat: 37.5180 }
    ors:
      # 2026-08-24에 api.openrouteservice.org가 셧오프됐다. HeiGIT이 모든 API를
      # api.heigit.org/<서비스명>/<버전> 구조로 통합하면서 구 도메인을 닫았다.
      # 4월 28일 공지 → 8월 24일 차단이고, 그 뒤 호출은 403에 다음 본문이 온다.
      #   {"error": "Access to this API has been disallowed"}
      # 게이트웨이(Tyk)가 내는 문구라 키 문제로 오인하기 쉽다. 키는 그대로 쓴다.
      # 경로 규칙은 그대로여서 base-url만 바꾸면 된다.
      base-url: https://api.heigit.org/openrouteservice
      api-key: ${ORS_API_KEY:}
      profile: cycling-regular
      timeout-seconds: 10
    kakao:
      local-base-url: https://dapi.kakao.com
      rest-api-key: ${KAKAO_REST_API_KEY:}
      js-api-key: ${KAKAO_JS_API_KEY:}
      timeout-seconds: 5
    public-data-portal:
      # 도로교통공단 자전거 교통사고 다발지역 (data.go.kr/data/15056681).
      #
      # ⚠️ base-url을 opendata.koroad.or.kr에서 apis.data.go.kr로 바꿨다.
      #    전자는 도로교통공단 자체 포털이고, 우리가 활용신청하고 실호출로 검증한 것은
      #    공공데이터포털 경유 경로다 — docs/shared/DATA_SOURCES.md 2.5
      taas:
        base-url: https://apis.data.go.kr/B552061
        service-key: ${TAAS_SERVICE_KEY:}
        timeout-seconds: 15
        # 사고년도. TAAS는 연도별로 데이터를 나눠 제공하고 갱신주기가 연 1회다.
        # 활용가이드 3.1 기준 최신은 2024. 새 연도가 나오면 이 값만 올린다.
        search-year: 2024
        # 1회 요청 건수. 활용가이드상 응답 상한이 16,000 byte인데
        # geom_json 한 건이 최대 4,000 byte라 크게 잡으면 잘린다.
        max-rows-per-call: 10
      # 서울 열린데이터광장. 공공데이터포털과 다른 기관이라 인증키도 별도다.
      # 따릉이 대여소·자전거 편의시설(거치대·공기주입기·수리센터) 소스.
      seoul:
        # https 미지원. 포트까지 포함해야 한다
        base-url: http://openapi.seoul.go.kr:8088
        api-key: ${SEOUL_OPEN_API_KEY:}
        timeout-seconds: 20
        # 1회 요청 상한. 초과하면 ERROR-336을 돌려준다
        max-rows-per-call: 1000

  # 인프라 POI 전체 조회(GET /api/v1/pois/all)를 서버 메모리에 두는 시간(초). 0이면 끈다.
  # 근거는 PoiServiceImpl.allCacheSeconds 주석. 적재 직후에도 이 시간까지는 옛 목록이 나간다.
  poi:
    all-cache-seconds: 300

  # MVP 서비스 범위: 한강 자전거길 서울 구간 (아라한강갑문~잠실, 약 40km)
  # TourAPI·POI 배치 적재와 코스 추천 서비스 영역 판정에 사용 (bounding box)
  mvp-area:
    min-lat: 37.500
    max-lat: 37.610
    min-lng: 126.780
    max-lng: 127.130

  # AI 동작
  ai:
    llm:
      primary-provider: gemini          # gemini | groq | ollama | claude
      # ⚠️ spring.ai.retry는 파일 아래쪽에 따로 있다. 그쪽을 끄지 않으면
      # 여기 timeout-seconds가 의미를 잃는다 - 매 시도는 끊기지만 재시도가 계속된다.
      # 두 곳에서 쓴다. GenAiClientConfig가 OkHttp callTimeout으로 걸어 실제 호출을 죽이고,
      # StructuredLlmCaller가 여기에 5초를 더해 보조 타임아웃을 건다.
      #
      # ⚠️ google-genai는 기본 타임아웃이 없다. 1.37.0의 ApiClient가 OkHttp의 기본 10초를
      # 일부러 끄고(connect·read·write 전부 0) HttpOptions.timeout만 callTimeout에 붙인다.
      # GenAiClientConfig 빈을 빼면 응답 없는 호출이 무기한 스레드를 붙잡는다.
      #
      # 앞서 관측한 15초 초과는 thinking 지연이 아니라 RPM 한도(5) 초과 재시도였다.
      # Lite로 옮기며 RPM이 20으로 늘었고 thinking도 minimal이라 원래 값으로 되돌린다.
      timeout-seconds: 15
      # 파싱 실패에만 쓴다. 타임아웃은 이미 15초를 쓴 뒤라 재시도하지 않고 fallback으로 간다
      max-retry: 1
      # 호출별 temperature. spring.ai.google.genai의 전역값(0.7)을 덮어쓴다.
      # 설계는 구조화 출력이라 낮게 잡는다 — 값이 높으면 없는 id를 만들거나 JSON이 깨진다.
      # 코멘트는 자연어라 조금 풀어야 트레이너 톤이 산다.
      design-temperature: 0.2
      comment-temperature: 0.6
      # 응답 최대 토큰. 지정 안 하면 공급자 기본값을 쓰는데, 그 기본값이 모델마다 다르다.
      # Nova Lite의 기본값이 낮아 경유지 5곳짜리 설계 JSON이 중간에 끊겨 파싱이 깨졌다
      # (닫는 ```/``` 코드블록도 못 만들고 잘림). Gemini·Claude는 기본값이 넉넉해 안 겪었다.
      # 설계·코멘트 둘 다 이 값 하나로 충분히 여유 있게 잡는다.
      max-output-tokens: 2048
      # Coach Ridely 톤 검증. 막으려는 것은 존댓말이 아니라 공문서투다.
      # 프롬프트가 요구하는 어조는 해요체("~해봐요", "~어때요?")이고, 이 값들은
      # 관공서 안내문 어투다. 입력이 전부 공공데이터(관광공사·도로교통공단·따릉이)라
      # LLM이 그 주제어를 따라 안내문 어투로 끌려간다 - 특히 안전 경고를 쓸 때.
      #
      # "하시기"가 아니라 "시기"인 이유: 앞 글자를 고정하면 "보시기 바랍니다",
      # "참고해 주시기 바랍니다"가 전부 빠져나간다. 어미 조각을 잡는 패턴이다.
      tone-violation-patterns:
        - "드립니다"
        - "시기 바랍니다"
        - "이용자"
      # 서비스 전체(사용자 합산) 하루 LLM 호출 상한. IP당 요청 제한과는 별개로,
      # 여러 명이 정상적으로 나눠 써도 총합이 예산을 넘지 않게 막는 안전장치다.
      # 추천 1건당 설계·코멘트 2번 호출하므로 150이면 하루 추천 약 75건 분량이다.
      # 넘으면 새 호출을 막지 않고 fallback(규칙 기반 설계·템플릿 코멘트)으로 넘어간다.
      daily-call-limit: 150
    rag:
      enabled: true
      top-k: 5
      similarity-threshold: 0.75

  # 코스 추천
  route:
    # 후보 수집 반경. 목표 거리에서 유도하고 아래 두 값으로 자른다.
    #
    # 하한 1,500m인 이유: 한강 폭이 약 1km라 반대편 강안 시설이 712~1,259m에 있다
    # (DATA_SOURCES 6.9.1). 노선 연결용 500m와 달리 여기서는 건너편도 후보로 본다.
    # 짧은 코스라도 이 아래로는 내리지 않는다.
    candidate-min-radius-m: 1500
    # 상한. 유도값이 커져도 여기서 멈춘다. 넘어가면 코스와 무관한 지역이 후보로 들어온다.
    candidate-radius-km: 8

    # 거리 1km당 후보 수. 목표 거리를 곱해 타입별 개수를 정한다.
    # 12km 코스 기준으로 관광 48 / 급수대 36 / 수리소 18 / 따릉이 18이 나온다.
    #
    # 이 값들은 원래 토큰을 아끼려고 1/5 수준이었다. 근거가 없었다. 후보 한 줄이 50토큰
    # 안팎이라 100건을 다 실어도 5,000 토큰이고, 쓰는 모델의 분당 입력 한도는 250,000이다.
    #
    # 다만 올려 보니 실제로 늘어난 것은 관광지와 따릉이뿐이다. 여의도~선유도 축에서
    # 급수대는 16곳, 수리소는 4곳이 전부라 유도값이 36·18이어도 그만큼밖에 없다.
    # 이 두 타입은 캡이 아니라 데이터가 상한이다.
    #
    # 타입별 비율은 남겨 둔다. 관광지가 가장 높은 이유는 코스의 목적지라 고를 폭이 있어야
    # 하기 때문이고, 급수대가 그다음인 것은 MVP 구간에 실제로 많아서다 — 176건 중 75건
    # (DATA_SOURCES 2.2). 수리소·따릉이는 "지나는 김에 들르는" 곳이라 낮게 잡는다.
    candidate-per-km:
      tour: 4.0
      water: 3.0
      repair-shop: 1.5
      bike-station: 1.5
    # 타입별 개수 하한·상한.
    #
    # 상한은 토큰 예산이 아니라 요청 유효성 가드다. 목표 거리는 100km까지 받으므로
    # 유도값이 관광 400건까지 올라가고, 그건 조회·렌더링 양쪽에서 감당할 이유가 없는 크기다.
    # 실제로 상한에 닿는지는 실측으로 확인하고 조정한다.
    candidate-min-count: 5
    candidate-max-count: 100
    # 추천 응답 멱등성 창. 같은 Idempotency-Key로 이 시간 안에 다시 오면
    # 새 코스를 만들지 않고 첫 응답을 그대로 돌려준다.
    #
    # 24시간이었다가 20분으로 줄였다. 처음에는 요청 조건(좌표·우선순위·목표거리)으로
    # 키를 만드는 전역 캐시였고 목적이 쿼터 절약이라 길수록 좋았다. 지금은 클라이언트가
    # 보낸 키를 쓰고 목적이 네트워크 재시도 방어라, 재시도 창만 덮으면 된다.
    #
    # 길게 두면 해롭다. 같은 사용자가 나중에 같은 키를 재사용할 일은 없지만,
    # 쓰이지 않는 행이 그만큼 오래 남는다. Stripe의 24시간은 서버 간 재시도와
    # 배치를 전제한 값이고 사람이 앱에서 누르는 창은 분 단위다.
    cache-ttl-minutes: 20
    max-target-distance-km: 100
    danger-zone-alert-distance-m: 200   # 라이딩 모드 근접 알림 거리

    # 회피 대상 위험 등급. 회피를 켠 사용자에게만 적용된다.
    #
    # CAUTION을 뺀 이유는 거리 때문이다. 전 등급을 피하면 실측에서 12km 목표에 15.5km가
    # 나왔다(+29%). 우회가 거리를 만드는데 그 우회의 대부분이 주의 등급 구역 때문이었다.
    # 한강 코스에 걸리는 구역이 거의 주의 등급(반경 200m 내 사고 4~5건)이라 그렇다.
    #
    # 사고 4건짜리 구역을 피하려고 3.5km를 더 타는 것은 교환이 맞지 않는다.
    # 경고는 6~9건, 위험은 10건 이상이거나 사망사고 포함이라 우회할 값이 있다.
    #
    # 여기서 뺀 등급도 통과 판정에는 그대로 잡히고 코치 코멘트가 짚어 준다.
    # 피하지 않을 뿐 알려주지 않는 것이 아니다.
    avoid-danger-levels:
      - DANGER
      - WARNING

  # CORS (프로파일별 오버라이드)
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://10.0.2.2:8080      # 안드로이드 에뮬레이터에서 호스트를 부르는 주소
      - http://localhost:8100     # Cordova 개발 서버(cordova serve)
      # cordova-android 12+ (WebViewAssetLoader)는 file://가 아니라 이 가상 오리진으로
      # 앱을 서빙한다 — 실기기 로그로 실측 확인(2026-09-17): Origin: https://localhost.
      # 구버전 cordova-android나 커스텀 스킴 설정이 남아 있을 수 있어 file:///null도 같이 둔다.
      - https://localhost
      - file://
      - "null"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

# ===== API 문서 (Swagger) =====
# 기본값은 비활성. 개발 프로파일(local)에서만 켠다.
#
# 문서를 공개하면 전체 엔드포인트·파라미터·에러 체계가 그대로 드러나 공격 표면이 노출되고,
# 화면의 Try it out으로 회원가입·로그인을 직접 호출할 수 있다.
# 새 프로파일을 추가할 때 설정을 빠뜨려도 노출되지 않도록 기본값을 꺼 둔다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ===== 로그 =====
logging:
  file:
    name: logs/ridely.log
  level:
    root: INFO
    kr.ridely: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.ai: INFO
    org.springframework.jdbc.core.JdbcTemplate: INFO        # JdbcClient 로그
    org.mybatis: INFO                                        # MyBatis 동작 로그
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"