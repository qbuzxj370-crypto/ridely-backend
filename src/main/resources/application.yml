# ============================================================
# Ridely 공통 설정 (application.yml)
# ============================================================
# 프로파일별 오버라이드: application-{local|dev|prod}.yml
# ============================================================

spring:
  application:
    name: ridely

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ===== Web =====
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ===== Jackson =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ===== DB 마이그레이션 (Flyway) =====
  # 앱 기동 시 src/main/resources/db/migration 의 V*.sql 을 순서대로 적용한다.
  # 이미 적용된 것은 flyway_schema_history 로 판별해 건너뛴다.
  # 적용된 마이그레이션 파일은 수정 금지 — 체크섬이 달라지면 기동이 실패한다(의도된 동작).
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 실패 시 조용히 넘어가지 않고 기동을 멈춘다
    validate-on-migrate: true

    # PostGIS 이미지는 컨테이너 최초 기동 시 확장을 설치하면서 public 스키마에
    # spatial_ref_sys 테이블과 geometry_columns·geography_columns 뷰를 만든다.
    # 그래서 볼륨을 지운 새 DB도 Flyway 눈에는 "비어있지 않은 스키마"이고,
    # 이 옵션이 없으면 "Found non-empty schema but no schema history table" 로 기동이 막힌다.
    baseline-on-migrate: true

    # ⚠️ 0이어야 한다. 기본값은 1이고, 1로 두면 V1이 "이미 적용됨"으로 표시되어
    #    건너뛴다 — 테이블이 하나도 생기지 않은 채 기동만 성공한다.
    #    0으로 두면 baseline(0) 이후인 V1부터 정상 적용된다.
    baseline-version: 0
    baseline-description: "postgis bootstrap (spatial_ref_sys)"

  # ===== DataSource (PostgreSQL) =====
  # 프로파일별 오버라이드: application-{local|dev|prod}.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridely}
    username: ${DB_USER:ridely}
    # 비밀번호도 기본값을 두지 않는다 (위 JWT_SECRET과 같은 이유)
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== Spring AI 1.1.6 - Google Gen AI =====
  # spring-ai-starter-model-google-genai 기반 (Spring AI 1.x에 정상 존재)
  #
  # 환경별 전환 전략:
  #   개발: Gemini Developer API (api-key 방식, 카드 불필요)
  #   운영: Vertex AI (project-id 방식, GCP 인증)
  # → application-local.yml 에서 api-key 설정
  # → application-prod.yml  에서 vertex 설정
  #
  # ADR-003 참조
  ai:
    google:
      genai:
        chat:
          options:
            # ⚠️ 2026-08-14: gemini-2.5-flash가 신규 사용자에게 닫혀 전환했다.
            #    "This model models/gemini-2.5-flash is no longer available to new users" 404.
            #    예고 은퇴일(10-16)보다 먼저 차단이 걸렸다.
            #
            #    모델 선택 기준은 성능이 아니라 무료 한도다. AI Studio 콘솔 실측:
            #      3.7 Flash        RPM 5  / RPD 20
            #      3.6 Flash        RPM 5  / RPD 20
            #      3.5 Flash Lite   RPM 20 / RPD 500   ← 채택
            #
            #    우리 파이프라인은 추천 1회에 LLM을 2번 부른다. RPD 20이면 하루 10회가 상한이라
            #    개발 중 테스트만으로 오전에 소진된다. Lite는 thinking도 기본 minimal이라 응답이 빠르다.
            #    작업 자체가 "목록에서 3곳 고르기 + 두 문장 쓰기"라 상위 모델의 추론력이 필요 없다.
            #
            #    품질이 부족하면 설계만 Lite로 두고 코멘트를 상위 모델로 올린다. 다만 그러면
            #    코멘트가 RPD 20에 묶인다. 유료 티어 전환이 근본 해결책이다 — DATA_SOURCES 4장.
            model: gemini-3.5-flash-lite
            temperature: 0.7
    # pgvector Vector Store — RAG 착수 시 재활성 (pom의 pgvector starter 주석과 세트)
    # vectorstore:
    #   pgvector:
    #     index-type: HNSW
    #     distance-type: COSINE_DISTANCE
    #     dimensions: 768
    #     table-name: riding_history_embedding
    # 임베딩 — RAG 착수 시 재활성 (pom의 vertex embedding starter 주석과 세트)
    # 재활성 전 결정: gemini-embedding-001 호출 경로 (google-genai embedding vs vertex embedding) — ADR-005
    # vertex:
    #   ai:
    #     embedding:
    #       text:
    #         options:
    #           # text-embedding-004는 2026-01-14 은퇴 → gemini-embedding-001 (3072차원 기본, MRL로 768 축소 지정 필수)
    #           model: gemini-embedding-001
    #           dimensions: 768

# ===== MyBatis (ADR-002 옵션 Y: 단순 CRUD 도메인) =====
# 사용 규칙:
#   - 단순 CRUD: MyBatis Mapper XML
#   - PostGIS·pgvector 연산자: JdbcClient + Raw SQL (별도)
#   - 벡터 검색: Spring AI VectorStore (위 spring.ai.vectorstore 참조)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: kr.ridely
  configuration:
    map-underscore-to-camel-case: true    # user_id → userId 자동 매핑
    default-statement-timeout: 30
    jdbc-type-for-null: NULL
    cache-enabled: false                  # MVP에선 캐시 미사용 (명시적)

# ===== Server =====
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always
    include-binding-errors: always

# ===== Actuator (헬스체크) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# ===== Ridely 애플리케이션 설정 =====
ridely:
  # JWT
  jwt:
    # 기본값을 두지 않는다. 저장소가 공개돼 있어 기본값을 적어 두면 그 값이 그대로 노출되고,
    # 환경변수 설정을 깜빡한 채 배포하면 누구나 같은 키로 토큰을 위조할 수 있다.
    # 값이 없으면 기동 시점에 실패하는 편이 안전하다.
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600       # 1시간
    refresh-token-validity-seconds: 1209600   # 14일
    issuer: ridely

  # 공공데이터 원본 파일 경로.
  # 이 파일들은 저장소에 커밋하지 않는다(db/seed/는 .gitignore 대상).
  # 각자 공공데이터포털에서 내려받아 배치한다 — docs/shared/DATA_SOURCES.md 3장 참조.
  #
  # 파일명에 한글이 들어가는데 자바는 파일명 인코딩에 sun.jnu.encoding(OS 로케일)을 쓴다.
  # 환경에 따라 이름을 조정해야 할 수 있어 코드가 아닌 설정으로 뺐다.
  seed:
    bike-route-coords: db/seed/국토종주_자전거길_노선좌표.csv
    bike-route-facilities: db/seed/국토종주자전거길_주변시설_좌표정보.csv

  # 외부 API
  external:
    # 한국관광공사 TourAPI ★ 관광데이터 공모전 핵심
    tourapi:
      # 활용매뉴얼 v4.4(2026-02) 기준 현행 서비스는 KorService2.
      # 오퍼레이션명도 모두 2로 끝난다 (locationBasedList2, detailCommon2 등).
      base-url: https://apis.data.go.kr/B551011/KorService2
      service-key: ${TOUR_API_KEY:}
      timeout-seconds: 10
      # MVP 적재 대상 콘텐츠 타입 (12=관광지, 14=문화시설, 39=음식점)
      content-type-ids: 12,14,39
      # 관광 콘텐츠 수집 범위.
      # 지역 확장 시 코드 수정 없이 지점만 추가하면 된다.
      # 반경 20km 한 번으로 덮으면 한강과 무관한 서울 전역이 딸려오므로
      # 한강 축을 따라 중심점을 두고 인접 지점과 겹치도록 배치한다.
      ingest:
        radius-m: 3000
        points:
          - { name: "아라한강갑문",   lng: 126.7965, lat: 37.5836 }
          - { name: "행주대교",       lng: 126.8330, lat: 37.5900 }
          - { name: "난지한강공원",   lng: 126.8783, lat: 37.5665 }
          - { name: "선유도공원",     lng: 126.8997, lat: 37.5434 }
          - { name: "여의도한강공원", lng: 126.9339, lat: 37.5265 }
          - { name: "노들섬",         lng: 126.9720, lat: 37.5170 }
          - { name: "반포한강공원",   lng: 126.9954, lat: 37.5100 }
          - { name: "잠원한강공원",   lng: 127.0300, lat: 37.5170 }
          - { name: "뚝섬한강공원",   lng: 127.0700, lat: 37.5290 }
          - { name: "잠실한강공원",   lng: 127.0820, lat: 37.5180 }
    ors:
      base-url: https://api.openrouteservice.org
      api-key: ${ORS_API_KEY:}
      profile: cycling-regular
      timeout-seconds: 10
    kakao:
      local-base-url: https://dapi.kakao.com
      rest-api-key: ${KAKAO_REST_API_KEY:}
      js-api-key: ${KAKAO_JS_API_KEY:}
      timeout-seconds: 5
    public-data-portal:
      # 도로교통공단 자전거 교통사고 다발지역 (data.go.kr/data/15056681).
      #
      # ⚠️ base-url을 opendata.koroad.or.kr에서 apis.data.go.kr로 바꿨다.
      #    전자는 도로교통공단 자체 포털이고, 우리가 활용신청하고 실호출로 검증한 것은
      #    공공데이터포털 경유 경로다 — docs/shared/DATA_SOURCES.md 2.5
      taas:
        base-url: https://apis.data.go.kr/B552061
        service-key: ${TAAS_SERVICE_KEY:}
        timeout-seconds: 15
        # 사고년도. TAAS는 연도별로 데이터를 나눠 제공하고 갱신주기가 연 1회다.
        # 활용가이드 3.1 기준 최신은 2024. 새 연도가 나오면 이 값만 올린다.
        search-year: 2024
        # 1회 요청 건수. 활용가이드상 응답 상한이 16,000 byte인데
        # geom_json 한 건이 최대 4,000 byte라 크게 잡으면 잘린다.
        max-rows-per-call: 10
      # 서울 열린데이터광장. 공공데이터포털과 다른 기관이라 인증키도 별도다.
      # 따릉이 대여소·자전거 편의시설(거치대·공기주입기·수리센터) 소스.
      seoul:
        # https 미지원. 포트까지 포함해야 한다
        base-url: http://openapi.seoul.go.kr:8088
        api-key: ${SEOUL_OPEN_API_KEY:}
        timeout-seconds: 20
        # 1회 요청 상한. 초과하면 ERROR-336을 돌려준다
        max-rows-per-call: 1000

  # MVP 서비스 범위: 한강 자전거길 서울 구간 (아라한강갑문~잠실, 약 40km)
  # TourAPI·POI 배치 적재와 코스 추천 서비스 영역 판정에 사용 (bounding box)
  mvp-area:
    min-lat: 37.500
    max-lat: 37.610
    min-lng: 126.780
    max-lng: 127.130

  # AI 동작
  ai:
    llm:
      primary-provider: gemini          # gemini | groq | ollama | claude
      # 초과하면 실패시킨다. fallback은 아직 없다
      #
      # 앞서 관측한 15초 초과는 thinking 지연이 아니라 RPM 한도(5) 초과 재시도였다.
      # Lite로 옮기며 RPM이 20으로 늘었고 thinking도 minimal이라 원래 값으로 되돌린다.
      timeout-seconds: 15
      max-retry: 1
      # 호출별 temperature. spring.ai.google.genai의 전역값(0.7)을 덮어쓴다.
      # 설계는 구조화 출력이라 낮게 잡는다 — 값이 높으면 없는 id를 만들거나 JSON이 깨진다.
      # 코멘트는 자연어라 조금 풀어야 트레이너 톤이 산다.
      design-temperature: 0.2
      comment-temperature: 0.6
      tone-violation-patterns:          # Coach Ridely 톤 검증
        - "드립니다"
        - "하시기 바랍니다"
        - "이용자"
    rag:
      enabled: true
      top-k: 5
      similarity-threshold: 0.75

  # 코스 추천
  route:
    # 후보 수집 반경. 목표 거리에서 유도하고 아래 두 값으로 자른다.
    #
    # 하한 1,500m인 이유: 한강 폭이 약 1km라 반대편 강안 시설이 712~1,259m에 있다
    # (DATA_SOURCES 6.9.1). 노선 연결용 500m와 달리 여기서는 건너편도 후보로 본다.
    # 짧은 코스라도 이 아래로는 내리지 않는다.
    candidate-min-radius-m: 1500
    # 상한. 유도값이 커져도 여기서 멈춘다. 넘어가면 코스와 무관한 지역이 후보로 들어온다.
    candidate-radius-km: 8

    # 거리 1km당 후보 수. 목표 거리를 곱해 타입별 개수를 정한다.
    # 12km 코스 기준으로 관광 10 / 급수대 8 / 수리소 3 / 따릉이 3이 나온다.
    #
    # 관광지가 가장 높은 이유는 코스의 목적지라 LLM이 고를 폭이 있어야 하기 때문이다.
    # 급수대가 그다음인 것은 MVP 구간에 실제로 많아서다 — 176건 중 75건 (DATA_SOURCES 2.2).
    # 수리소·따릉이는 "지나는 김에 들르는" 곳이라 낮게 잡는다.
    candidate-per-km:
      tour: 0.8
      water: 0.7
      repair-shop: 0.25
      bike-station: 0.25
    # 타입별 개수 하한·상한. 상한은 프롬프트 토큰 예산이다.
    # 네 타입이 모두 상한이면 60건이고, 렌더링하면 2,000 토큰대다.
    candidate-min-count: 3
    candidate-max-count: 15
    cache-ttl-hours: 24
    max-target-distance-km: 100
    danger-zone-alert-distance-m: 200   # 라이딩 모드 근접 알림 거리

  # CORS (프로파일별 오버라이드)
  cors:
    allowed-origins:
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

# ===== API 문서 (Swagger) =====
# 기본값은 비활성. 개발 프로파일(local)에서만 켠다.
#
# 문서를 공개하면 전체 엔드포인트·파라미터·에러 체계가 그대로 드러나 공격 표면이 노출되고,
# 화면의 Try it out으로 회원가입·로그인을 직접 호출할 수 있다.
# 새 프로파일을 추가할 때 설정을 빠뜨려도 노출되지 않도록 기본값을 꺼 둔다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ===== 로그 =====
logging:
  level:
    root: INFO
    kr.ridely: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.ai: INFO
    org.springframework.jdbc.core.JdbcTemplate: INFO        # JdbcClient 로그
    org.mybatis: INFO                                        # MyBatis 동작 로그
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"